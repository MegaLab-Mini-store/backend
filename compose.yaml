services:
  postgres:
    image: postgres:17-alpine
    container_name: ministore-postgres
    environment:
      POSTGRES_DB: ministore
      POSTGRES_USER: ministore
      POSTGRES_PASSWORD: ministore
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ministore -d ministore" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles:
      - db

  backend:
    build: .
    image: ghcr.io/megalab-mini-store/backend:latest
    container_name: ministore-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/ministore}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-ministore}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-ministore}
      MINISTORE_OWNER_USERNAME: ${MINISTORE_OWNER_USERNAME:-}
      MINISTORE_OWNER_PASSWORD: ${MINISTORE_OWNER_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
