server:
  port: 8080

spring:
  application:
    name: ministore-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:ministore}
    username: ${SPRING_DATASOURCE_USERNAME:ministore}
    password: ${SPRING_DATASOURCE_PASSWORD:ministore}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

app:
  timezone: Asia/Bishkek
  cashier:
    login: ${CASHIER_LOGIN:cashier}
    password-hash: ${CASHIER_PASSWORD_HASH}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 12